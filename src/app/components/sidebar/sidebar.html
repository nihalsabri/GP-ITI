<div class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <button class="btn-toggle" (click)="toggleSidebar()" title="Toggle Sidebar">
      <span class="toggle-icon">{{ isCollapsed ? '→' : '←' }}</span>
    </button>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
          <h4 class="dashboard-title" [class.hidden]="isCollapsed">Dashboard</h4>

    </a>
  </div>

  <nav class="nav-menu" [class.hidden]="isCollapsed">
    <a routerLink="orders" routerLinkActive="active" class="nav-link">
      <span class="icon"></span>
      <span class="label">Orders</span>
    </a>
    <a routerLink="clients" routerLinkActive="active" class="nav-link">
      <span class="icon"></span>
      <span class="label">Clients</span>
    </a>
    <a routerLink="services" routerLinkActive="active" class="nav-link">
      <span class="icon"></span>
      <span class="label">Services</span>
    </a>
    <a routerLink="tradespeople" routerLinkActive="active" class="nav-link">
      <span class="icon"></span>
      <span class="label">Tradespeople</span>
    </a>
  </nav>

  <button class="btn-open-sidebar" *ngIf="isCollapsed" (click)="toggleSidebar()" title="Open Sidebar">
    <span class="open-icon">☰</span>
  </button>

</div>
