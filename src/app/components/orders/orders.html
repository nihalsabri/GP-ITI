<p>orders works!</p>
<div class="orders-page container">
  <h2 class="page-title">الطلبات</h2>

  <div class="actions">
    <button class="btn-add" (click)="openModal()">+ إضافة طلب جديد</button>
  </div>

  <table class="orders-table">
    <thead>
      <tr>
        <th>رقم الطلب</th>
        <th>اسم العميل</th>
        <th>اسم الفني</th>
        <th>الخدمة المطلوبة</th>
        <th>الحالة</th>
        <th>تاريخ الطلب</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ getClientName(order.clientId) }}</td>
        <td>{{ getTradespersonName(order.tradespersonId) }}</td>
        <td>{{ order.serviceType }}</td>
        <td>
          <span [class]="'status ' + order.status.toLowerCase()">
            {{ order.status }}
          </span>
        </td>
        <td>{{ order.date }}</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- نافذة إضافة طلب جديد -->
<div class="modal" [class.show]="isModalOpen">
  <div class="modal-content">
    <h3>إضافة طلب جديد</h3>

    <form (ngSubmit)="addOrder()" #orderForm="ngForm">
      <label>العميل:</label>
      <select [(ngModel)]="newOrder.clientId" name="clientId" required>
        <option [ngValue]="null">-- اختار العميل --</option>
        <option *ngFor="let client of clients" [ngValue]="client.id">{{ client.name }}</option>
      </select>

      <label>الفني:</label>
      <select [(ngModel)]="newOrder.tradespersonId" name="tradespersonId" required>
        <option [ngValue]="null">-- اختار الفني --</option>
        <option *ngFor="let person of tradespeople" [ngValue]="person.id">{{ person.name }} ({{ person.job }})</option>
      </select>

      <label>نوع الخدمة:</label>
      <input type="text" [(ngModel)]="newOrder.serviceType" name="serviceType" required>

      <label>الحالة:</label>
      <select [(ngModel)]="newOrder.status" name="status" required>
        <option>جديدة</option>
        <option>قيد التنفيذ</option>
        <option>مكتملة</option>
      </select>

      <label>تاريخ الطلب:</label>
      <input type="date" [(ngModel)]="newOrder.date" name="date" required>

      <div class="modal-actions">
        <button type="submit" class="btn-add">إضافة</button>
        <button type="button" class="btn-delete" (click)="closeModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" [class.show]="isModalOpen" (click)="closeModal()"></div>
