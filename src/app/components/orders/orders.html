<div class="orders-page">
  <!-- Header Section -->
  <div class="orders-header">
    
    <div class="header">
      <h2 class="page-title">الطلبات</h2>
      <img src="order.png" width="40" height="40" alt="orders icon" />
    </div>

    <div class="actions">
      <button class="btn-add" (click)="openModal(); $event.stopPropagation()">
        أضف أوردر جديد
        <img src="add.png" width="30" height="30" alt="add icon" />
      </button>
    </div>
  </div>

  <!-- Table Section -->
  <table class="orders-table">
    <thead>
      <tr>
        <th>رقم الأوردر</th>
        <th>العميل</th>
        <th>الفني</th>
        <th>الخدمة</th>
        <th>الحالة</th>
        <th>التاريخ</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td data-label="رقم الأوردر">{{ order.id }}</td>
        <td data-label="العميل">{{ getClientName(order.clientId) }}</td>
        <td data-label="الفني">{{ getTradespersonName(order.tradespersonId) }}</td>
        <td data-label="الخدمة">{{ order.serviceType }}</td>
        <td data-label="الحالة">
          <span class="status {{ order.status }}">{{ order.status }}</span>
        </td>
        <td data-label="التاريخ">{{ order.date }}</td>
        <td data-label="إجراءات">
          <button class="btn-edit" (click)="openModal(order); $event.stopPropagation()">
            <img src="editIcon.svg" width="30" height="40" alt="edit" />
          </button>
          <button class="btn-delete" (click)="deleteOrder(order.id)">
            <img src="delete.png" width="30" height="40" alt="delete" />
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal Overlay -->
<div class="overlay" [class.show]="isModalOpen" (click)="onOverlayClick($event)"></div>

<!-- Modal -->
<div class="modal" [class.show]="isModalOpen" (click)="$event.stopPropagation()">
  <h3>{{ isEditMode ? 'تعديل الأوردر' : 'إضافة أوردر جديد' }}</h3>
  <form #orderForm="ngForm" (ngSubmit)="saveOrder(orderForm)">
    <label>العميل:</label>
    <select [(ngModel)]="newOrder.clientId" name="clientId" required>
      <option [ngValue]="0">اختر العميل</option>
      <option *ngFor="let c of clients" [ngValue]="c.id">{{ c.name }}</option>
    </select>

    <label>الفني:</label>
    <select [(ngModel)]="newOrder.tradespersonId" name="tradespersonId" required>
      <option [ngValue]="0">اختر الفني</option>
      <option *ngFor="let t of tradespeople" [ngValue]="t.id">{{ t.name }} - {{ t.job }}</option>
    </select>

    <label>نوع الخدمة:</label>
    <input type="text" [(ngModel)]="newOrder.serviceType" name="serviceType" required />

    <label>الحالة:</label>
    <select [(ngModel)]="newOrder.status" name="status" required>
      <option value="جديدة">جديدة</option>
      <option value="مكتملة">مكتملة</option>
      <option value="ملغاة">ملغاة</option>
    </select>

    <label>التاريخ:</label>
    <input type="date" [(ngModel)]="newOrder.date" name="date" required />

    <div class="modal-actions">
      <button type="submit" class="action-btn">
        <img [src]="isEditMode ? 'editIcon.svg' : 'add.png'" width="20" height="20" alt="" />
        <span>{{ isEditMode ? 'تحديث' : 'إضافة' }}</span>
      </button>
      <button type="button" class="close-btn" (click)="closeModal()">
        <img src="falseIcon.svg" width="20" height="20" alt="cancel" />
        <span>إلغاء</span>
      </button>
    </div>
  </form>
</div>
