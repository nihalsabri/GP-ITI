<div class="card">
  <div class="card-header">
    <div class="header-left">
      <h3>Clients</h3>
    </div>
    <div class="header-right">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="filterData()"
        placeholder="Search clients..."
      />
      <button class="btn btn-primary" (click)="openAddModal()">Add Client</button>
    </div>
  </div>

  <div class="card-body table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Last Order</th>
          <th>CreatedAt</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="filteredClients$ | async as clients">
          <tr *ngFor="let c of clients; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.email }}</td>
            <td>{{ getLastOrderDisplay(c.orders) || '-' }}</td>
            <td>{{ c.createdAt ? (c.createdAt | date : 'dd/MM/yyyy') : '-' }}</td>
            <td>
              <!-- Only delete available from dashboard -->
              <button class="btn btn-danger btn-sm" (click)="deleteClient(c.id, c.name)">
                del
              </button>
            </td>
          </tr>

          <tr *ngIf="clients.length === 0">
            <td colspan="7" class="text-center">No clients yet</td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Client Modal (simple inline modal) -->
<div class="modal-backdrop" *ngIf="showAddModal">
  <div class="modal-card">
    <h4>Add Client</h4>
    <div class="form-row">
      <label>Name</label>
      <input type="text" [(ngModel)]="formData.name" />
    </div>
    <div class="form-row">
      <label>Email</label>
      <input type="email" [(ngModel)]="formData.email" />
    </div>
    <div class="form-row">
      <label>Phone</label>
      <input type="text" [(ngModel)]="formData.phone" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="saveClient()">Save</button>
    </div>
  </div>
</div>
